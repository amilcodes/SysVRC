<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SysVRC sim</title>
<style>
  :root {
    --bg: #0f1114; --panel: #14171b; --raise: #1b1f25; --line: #252a31;
    --ink: #e7eaee; --ink2: #a6aeb8; --muted: #6c7480;
    --amber: #f5b800; --cyan: #1fc8f0; --red: #d8423b; --blue: #2f7fd8; --late: #e5534b; --ok: #4fbf7a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
  button, select { font: inherit; color: inherit; }
  #app { display: grid; grid-template-rows: 44px 1fr 64px; grid-template-columns: minmax(0, 1fr); height: 100vh; }

  header { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; white-space: nowrap; }
  .brand { font: 600 12px var(--mono); color: var(--muted); }
  .name { font: 600 13px var(--mono); overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 6px; }
  .conn { font: 12px var(--mono); color: var(--ink2); }
  .conn.live .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .conn.replay .dot { background: var(--cyan); }
  .conn.off .dot { background: var(--late); }
  .tag { font: 12px var(--mono); color: var(--ink2); }
  .tag.warn { color: var(--amber); }
  .grow { flex: 1; }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); color: var(--ink2); }
  .btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: 12px var(--mono); color: var(--ink2); }
  .btn:hover { color: var(--ink); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  #field { display: block; }
  #hud { position: absolute; left: 12px; bottom: 10px; font: 12px var(--mono); color: var(--ink2); pointer-events: none; display: flex; gap: 14px; text-shadow: 0 1px 2px #000; }
  #hud b { color: var(--ink); font-weight: 500; }
  #legend { position: absolute; right: 12px; bottom: 10px; font: 11px var(--mono); color: var(--muted); display: flex; gap: 12px; pointer-events: none; }
  #legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: middle; }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #code { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; font: 12px/1.25 var(--mono); }
  #code li { display: grid; grid-template-columns: 34px 12px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 10px 3px 0; border-left: 2px solid transparent; }
  #code li.on { background: #222019; border-left-color: var(--amber); }
  #code .ln { color: var(--muted); text-align: right; }
  #code .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #code .k-wait .tx, #code .k-delay .tx, #code .k-set .tx { color: var(--ink2); }
  #code .done .tx { opacity: 0.55; }
  #code .g { width: 7px; height: 7px; border-radius: 1px; justify-self: center; }
  #code .k-motion .g { background: var(--amber); }
  #code .k-action .g { background: var(--cyan); transform: rotate(45deg); width: 6px; height: 6px; }
  #code .bd { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #code .bd.warn { color: var(--amber); }
  #code .bd.live { color: var(--ink); }
  #code .bd.ok { color: var(--ink2); }
  #code .bd.late { color: var(--late); }
  .tag b { color: var(--ink); font-weight: 600; }
  #code .empty { color: var(--muted); padding: 10px 14px; display: block; }

  #loop { border-top: 1px solid var(--line); padding: 8px 12px 10px; font: 11px/1.6 var(--mono); color: var(--ink2); }
  #loop .row { display: grid; grid-template-columns: 52px 1fr; gap: 6px; }
  #loop .k { color: var(--muted); }
  #loop b { color: var(--ink); font-weight: 500; }
  #loop .bad { color: var(--late); }
  #hist { width: 100%; height: 54px; display: block; margin-top: 6px; }
  .drive { display: grid; grid-template-columns: 52px 1fr 1fr; gap: 6px; align-items: center; }
  .bar { height: 6px; background: var(--raise); border-radius: 3px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; background: var(--amber); }
  .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }

  footer { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 0 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #play { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); cursor: pointer; display: grid; place-items: center; }
  #clock { font: 600 15px var(--mono); min-width: 64px; font-variant-numeric: tabular-nums; }
  #tl { width: 100%; height: 48px; display: block; cursor: pointer; touch-action: none; }

  @media (max-width: 860px) {
    #app { grid-template-rows: auto 1fr 64px; }
    header { flex-wrap: wrap; padding: 6px 12px; row-gap: 6px; white-space: normal; }
    .stats { flex-wrap: wrap; row-gap: 2px; }
    .stats > span { white-space: nowrap; }
    main { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) 260px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">SysVRC</span>
    <span class="name" id="name">—</span>
    <span class="conn off" id="conn"><span class="dot"></span><span id="connText">offline</span></span>
    <span class="tag" id="mode"></span>
    <span class="tag warn" id="intf" hidden>interfered</span>
    <span class="tag" id="score" hidden></span>
    <span class="grow"></span>
    <select id="layout" title="field"></select>
    <span class="tag" id="sched"></span>
    <button class="btn" id="snap" title="save a PNG of this page on the sim host">png</button>
  </header>
  <main>
    <section id="stage">
      <canvas id="field"></canvas>
      <div id="hud"></div>
      <div id="legend"><span><i style="border-color:var(--amber)"></i>robot</span><span><i style="border-color:#fff;border-top-style:dashed"></i>odometry</span></div>
    </section>
    <aside>
      <ol id="code"><li class="empty">waiting for a routine</li></ol>
      <div id="loop">
        <div class="row"><span class="k">wake</span><span id="wake">—</span></div>
        <div class="row"><span class="k">exec</span><span id="exec">—</span></div>
        <div class="row"><span class="k">misses</span><span id="miss">—</span></div>
        <div class="drive"><span class="k">L / R</span><div class="bar"><i id="bl"></i></div><div class="bar"><i id="br"></i></div></div>
        <canvas id="hist" title="wake latency, log count"></canvas>
      </div>
    </aside>
  </main>
  <footer>
    <button id="play" title="play / pause (space)" hidden><svg width="12" height="12" viewBox="0 0 12 12"><path id="playIcon" d="M2 1l9 5-9 5z" fill="currentColor"/></svg></button>
    <span id="clock">0.00</span>
    <canvas id="tl"></canvas>
    <button class="btn" id="live" title="follow the live run" hidden>live</button>
  </footer>
</div>
<script src="field.js"></script>
<script src="game.js"></script>
<script>
"use strict";
const F = window.VexField;
const $ = (id) => document.getElementById(id);
const dpr = () => window.devicePixelRatio || 1;
const store = { get(k, d) { try { const v = localStorage.getItem("sysvrc:dash:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("sysvrc:dash:" + k, JSON.stringify(v)); } catch {} } };

// Every frame since the routine armed. Live and replay render the same way:
// pick a frame index, rebuild everything up to it.
let frames = [];
let cursor = -1;          // index being shown
let follow = true;        // live: keep showing the newest frame
let playing = false, replay = false;
// The field drawn under the robot. Until someone picks one: the skills field
// for skills, tiles only when the routine starts at (0, 0) (the sim doesn't
// know where it really starts, so game elements would be in the wrong place).
let layoutKey = store.get("layout", null);
function autoLayout(s) {
  if (store.get("layout", null)) return;
  const p = (idle && idle.truth) || s;          // where it spawned, if we saw it
  const zero = Math.abs(p.x) < 3 && Math.abs(p.y) < 3;
  layoutKey = zero ? "blank" : /skills/i.test(s.mission) ? "high-stakes-skills" : "high-stakes";
  $("layout").value = layoutKey;
}
let lastStats = null, lastHist = null;

for (const [k, L] of Object.entries(F.LAYOUTS)) {
  const o = document.createElement("option"); o.value = k; o.textContent = L.name; $("layout").appendChild(o);
}
$("layout").value = layoutKey || "high-stakes";
$("layout").onchange = (e) => { layoutKey = e.target.value; store.set("layout", layoutKey); fieldCache = null; render(); };

// ------------------------------------------------------------------ frames
const armed = (f) => f.state && f.state.steps > 0 && f.state.step >= 0;
// Mission clock: the controller's own when it sends one (sim time, right even
// when Gazebo runs slower than real time); wall time since arming otherwise.
function mt(i) {
  const s = frames[i].state;
  if (s && s.mission_ms != null) return s.mission_ms / 1000;
  return frames[i].t - frames[0].t;
}
function ingest(f) {
  if (f.stats) { lastStats = f.stats; if (f.stats.wake_hist) lastHist = f.stats; }
  if (!armed(f)) { if (!frames.length) { idle = f; if (!loading) render(); } return; }
  const prev = frames[frames.length - 1];
  const restarted = prev && (f.state.mission !== prev.state.mission || f.state.step < prev.state.step ||
                             (f.state.mission_ms != null && f.state.mission_ms + 50 < prev.state.mission_ms));
  if (restarted) { frames = []; setupCode(f.state); }
  else if (prev && prev.state.done) { if (!loading && follow) renderLoop(lastStats, prev.state); return; }
  if (!frames.length) { setupCode(f.state); autoLayout(f.state); }
  frames.push(f);
  if (frames.length > 20000) frames.shift();
  if (follow || cursor < 0) cursor = follow ? frames.length - 1 : 0;
  if (!loading) render();
}
let idle = null, loading = false;

// ------------------------------------------------------------------ instruction rail
const kindOf = (t) => t.startsWith("action(") ? "action" : t.startsWith("pid_wait") ? "wait" : t.startsWith("delay(") ? "delay"
  : /^(pid_(drive|turn|swing|odom)\w*_set|drive_set|pid_odom_set)/.test(t) && !/(constants|exit_condition|max_set|speed|chain_constant|_behavior)/.test(t) ? "motion" : "set";
let labels = [];
function setupCode(s) {
  labels = s.labels && s.labels.length ? s.labels : labels;
  $("name").textContent = s.mission;
  const ol = $("code");
  ol.innerHTML = "";
  labels.forEach((t, i) => {
    const li = document.createElement("li");
    li.className = "k-" + kindOf(t);
    li.innerHTML = `<span class="ln">${i + 1}</span><span class="g"></span><span class="tx"></span><span class="bd"></span>`;
    li.querySelector(".tx").textContent = t.replace(/^action\("(.*)"\)$/, "$1");
    li.title = t;
    ol.appendChild(li);
  });
  fieldCache = null;
}
const exitWord = (e) => ({ small_error: "settled", big_error: "settled", passed: "passed", velocity: "stalled", timeout: "timeout" }[e] || "");

// ------------------------------------------------------------------ game elements
// With a robot.json (launch with robot:=robots/<name>), run the same element
// sim as the auton_check report over what this run actually did: the robot
// where the backend says it was, each mechanism call when the controller
// stepped past it.
const GAME = window.VexGame;
let robotSpec = null, robotModel = null, game = null, gameKey = "";
fetch("robot.json").then((r) => (r.ok ? r.json() : null)).then((spec) => {
  if (!spec || !GAME) return;
  robotSpec = spec; robotModel = GAME.compile(spec);
  fieldCache = null; render();
}).catch(() => {});
const gameOn = () => !!robotModel && GAME.supported(layoutKey || "") && frames.length > 1;
function realPoseAt(t) {
  let lo = 0, hi = frames.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (mt(m) <= t) lo = m; else hi = m - 1; }
  const a = frames[lo], b = frames[Math.min(lo + 1, frames.length - 1)];
  const pa = a.truth || a.state, pb = b.truth || b.state;
  const ta = mt(lo), tb = mt(Math.min(lo + 1, frames.length - 1));
  const u = tb > ta ? Math.max(0, Math.min(1, (t - ta) / (tb - ta))) : 0;
  let dh = pb.theta - pa.theta; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return [pa.x + (pb.x - pa.x) * u, pa.y + (pb.y - pa.y) * u, pa.theta + dh * u];
}
function runGame() {
  if (!gameOn()) { game = null; return; }
  const key = `${frames.length}|${layoutKey}`;
  if (key === gameKey && game) return;
  gameKey = key;
  // action k = the k-th action( line; it fired when the controller stepped past it
  const actIdx = labels.map((t, j) => (t.startsWith("action(") ? j : -1)).filter((j) => j >= 0);
  const texts = actIdx.map((j) => labels[j].replace(/^action\("(.*)"\)$/, "$1"));
  const times = actIdx.map(() => -1);
  for (let k = 1; k < frames.length; k++) {
    const a = frames[k - 1].state, b = frames[k].state;
    const upTo = b.done ? labels.length : b.step;
    actIdx.forEach((j, n) => { if (times[n] < 0 && j >= Math.max(0, a.step) && j < upTo) times[n] = mt(k); });
  }
  if (frames[0].state.step > 0) actIdx.forEach((j, n) => { if (times[n] < 0 && j < frames[0].state.step) times[n] = 0; });
  const mission = frames[0].state.mission || "";
  game = GAME.run({ layout: layoutKey, robot: robotModel, alliance: /blue/i.test(mission) ? "blue" : "red",
                    poseAt: realPoseAt, events: GAME.events(robotModel, texts, times),
                    end: mt(frames.length - 1), budget: budget() });
  game.actIdx = actIdx;
}
function renderScore(t) {
  const el = $("score");
  if (!game) { el.hidden = true; return; }
  const sc = GAME.scoreAt(game, Math.min(t, budget()), realPoseAt);
  let html = `<b>${sc.us}</b> pts`;
  if (sc.awp) {
    const n = ["rings", "stakes", "line", "ladder"].filter((k) => sc.awp[k]).length;
    html += ` · AWP ${n === 4 ? "✓" : n + "/4"}`;
  }
  el.innerHTML = html;
  el.hidden = false;
}
let shownStep = -2;
function renderCode(i) {
  const s = frames[i].state, items = $("code").children;
  if (!labels.length) return;
  // An exit belongs to the wait that produced it: the nearest wait before the
  // instruction the controller moved on to.
  const exits = [];
  for (let k = 1; k <= i; k++) {
    const a = frames[k - 1].state, b = frames[k].state;
    if (b.step === a.step && !(b.done && !a.done)) continue;
    const upTo = b.done ? labels.length : b.step;
    for (let j = upTo - 1; j >= 0; j--) if (kindOf(labels[j]) === "wait") { if (!exits[j]) exits[j] = b.last_exit; break; }
  }
  for (let j = 0; j < items.length; j++) {
    const li = items[j], bd = li.querySelector(".bd");
    const on = j === s.step && !s.done;
    li.classList.toggle("on", on);
    li.classList.toggle("done", j < s.step || s.done);
    bd.className = "bd";
    if (on && (kindOf(labels[j]) === "wait" || kindOf(labels[j]) === "delay")) {
      bd.textContent = `${s.error.toFixed(1)} · ${(s.elapsed_ms / 1000).toFixed(2)}s`; bd.classList.add("live");
    } else if (exits[j]) {
      bd.textContent = exitWord(exits[j]);
      if (exits[j] === "velocity" || exits[j] === "timeout") bd.classList.add("warn");
    } else if (game && j < (s.done ? labels.length : s.step) && game.actIdx.includes(j)) {
      const o = game.outcome[game.actIdx.indexOf(j)];
      bd.textContent = o && o.ok !== null ? o.text : "";
      if (o && o.ok === false) bd.classList.add("late"); else if (o && o.ok) bd.classList.add("ok");
    } else bd.textContent = "";
  }
  if (s.step !== shownStep && items[s.step]) items[s.step].scrollIntoView({ block: "nearest" });
  shownStep = s.step;
}

// ------------------------------------------------------------------ field
const fc = $("field");
let V = null, fieldCache = null, size = 0;
function layout() {
  const r = $("stage").getBoundingClientRect();
  size = Math.max(200, Math.floor(Math.min(r.width, r.height) - 16));
  fc.style.width = fc.style.height = size + "px";
  fc.width = fc.height = Math.round(size * dpr());
  V = F.view(size, 82);
  fieldCache = null;
}
function sideColor() {
  const n = (frames[0] || idle || {}).state ? (frames[0] || idle).state.mission : "";
  return /blue/i.test(n) ? F.BLUE : F.RED;
}
function drawFieldLayer(i) {
  if (!V) return;
  if (!fieldCache) {
    fieldCache = document.createElement("canvas");
    fieldCache.width = fieldCache.height = Math.round(size * dpr());
    const g = fieldCache.getContext("2d"); g.scale(dpr(), dpr());
    F.drawField(g, V, layoutKey || "high-stakes", { elements: !(robotModel && GAME.supported(layoutKey || "")) });
  }
  const g = fc.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(fieldCache, 0, 0);
  g.scale(dpr(), dpr());
  g.lineJoin = g.lineCap = "round";
  const P = (x, y) => V.px(x, y);

  if (i < 0) {
    const f = idle;
    if (f && f.truth) F.drawRobot(g, V, [f.truth.x, f.truth.y, f.truth.theta], { fill: sideColor(), stroke: "#fff", front: "#fff", alpha: 0.6 });
    return;
  }
  const trail = (get, style, width, dash) => {
    g.strokeStyle = style; g.lineWidth = width; g.setLineDash(dash || []);
    g.beginPath();
    let n = 0;
    for (let k = 0; k <= i; k++) { const p = get(frames[k]); if (!p) continue; const [x, y] = P(p.x, p.y); n++ ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke(); g.setLineDash([]);
  };
  // where the robot really went (backend truth), and where odometry thinks it went
  const real = (f) => f.truth || f.state;
  trail((f) => f.state, "rgba(255,255,255,0.55)", 1.25, [4, 4]);
  trail(real, "#f5b800", 2.5);

  // mechanism calls, where the robot was when they fired
  let lastAt = -1;
  for (let k = 0; k <= i; k++) {
    const s = frames[k].state;
    if (!s.action || s.action === "none" || s.action_at_ms <= lastAt) continue;
    lastAt = s.action_at_ms;
    const r = real(frames[k]);
    const [x, y] = P(r.x, r.y);
    g.save(); g.translate(x, y); g.rotate(Math.PI / 4);
    g.fillStyle = "#1fc8f0"; g.strokeStyle = "#14171b"; g.lineWidth = 2;
    g.beginPath(); g.rect(-3.5, -3.5, 7, 7); g.stroke(); g.fill();
    g.restore();
  }

  const f = frames[i], s = f.state;
  const r = real(f);
  const t = mt(i);
  const gs = game ? GAME.stateAt(game, t) : null;
  if (gs) F.drawElements(g, V, layoutKey, gs);
  const shape = robotModel ? { w: robotModel.w, l: robotModel.l, outline: robotModel.outline } : {};
  if (f.truth) F.drawRobot(g, V, [s.x, s.y, s.theta], { ...shape, stroke: "rgba(255,255,255,0.8)", width: 1.25 });
  F.drawRobot(g, V, [r.x, r.y, r.theta], { ...shape, fill: sideColor(), stroke: "#fff", front: "#fff", width: 1.5, alpha: 0.95 });
  if (gs && gs.inRobot.length) F.drawStack(g, V, r.x, r.y, gs.inRobot, 0.8);

  const err = f.truth ? Math.hypot(s.x - f.truth.x, s.y - f.truth.y) : null;
  $("hud").innerHTML = `<span>x <b>${r.x.toFixed(1)}″</b></span><span>y <b>${r.y.toFixed(1)}″</b></span><span>θ <b>${F.wrapDeg(r.theta).toFixed(0)}°</b></span>` +
    (err != null ? `<span>odom off <b style="color:${err > 6 ? "var(--late)" : err > 2 ? "var(--amber)" : "var(--ink)"}">${err.toFixed(1)}″</b></span>` : "");
}

// ------------------------------------------------------------------ loop timing
function renderLoop(st, s) {
  if (st) {
    const P = st.period_us;
    $("sched").textContent = `${st.rate.toFixed(0)} Hz · ${st.policy.replace("SCHED_", "")} ${st.prio} · cpu ${st.cpu}${st.mlock ? "" : " · no mlock"}`;
    $("wake").innerHTML = `p50 <b>${st.wake_p50.toFixed(0)}</b> · p99 <b>${st.wake_p99.toFixed(0)}</b> · max <b class="${st.wake_max > P ? "bad" : ""}">${st.wake_max.toFixed(0)}</b> µs`;
    $("exec").innerHTML = `p99 <b>${st.exec_p99.toFixed(0)}</b> µs · budget ${(P / 1000).toFixed(2)} ms`;
    const bad = (n) => `<b class="${n ? "bad" : ""}">${n}</b>`;
    $("miss").innerHTML = `${bad(st.missed)} missed · ${bad(st.overruns)} over · ${st.stale} stale / ${st.ticks}`;
  }
  if (s) {
    const bar = (id, v) => { const el = $(id), pct = (Math.min(127, Math.abs(v)) / 127) * 50; el.style.left = (v < 0 ? 50 - pct : 50) + "%"; el.style.width = pct + "%"; };
    bar("bl", s.cmd_l); bar("br", s.cmd_r);
    $("mode").textContent = s.done ? "done" : s.mode;
    $("intf").hidden = !s.interfered;
  }
  drawHist(lastHist);
}
function drawHist(st) {
  const c = $("hist"), r = c.getBoundingClientRect();
  c.width = Math.round(r.width * dpr()); c.height = Math.round(r.height * dpr());
  const g = c.getContext("2d"); g.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  const W = r.width, H = r.height;
  g.clearRect(0, 0, W, H);
  if (!st || !st.wake_hist) return;
  const h = st.wake_hist, b = st.bucket_us;
  let last = 0; for (let k = 0; k < h.length; k++) if (h[k]) last = k;
  const n = Math.max(last + 2, 20), bw = W / n, top = Math.log10(Math.max(...h.slice(0, n)) + 1);
  for (let k = 0; k < n; k++) {
    if (!h[k]) continue;
    const v = Math.log10(h[k] + 1) / top, y = (H - 12) * (1 - v);
    g.fillStyle = k * b >= st.period_us ? "#e5534b" : k * b >= st.wake_p99 ? "#f5b800" : "rgba(166,174,184,0.7)";
    g.fillRect(k * bw, y, Math.max(1, bw - 1), H - 12 - y);
  }
  g.fillStyle = "#6c7480"; g.font = "10px " + getComputedStyle(document.body).getPropertyValue("--mono");
  g.textBaseline = "bottom"; g.textAlign = "left"; g.fillText("0", 0, H);
  g.textAlign = "right"; g.fillText(`${((n * b) / 1000).toFixed(2)} ms`, W, H);
}

// ------------------------------------------------------------------ timeline
const tl = $("tl");
let TLW = 0;
function budget() { const n = frames.length ? frames[0].state.mission : idle && idle.state ? idle.state.mission : ""; return /skills/i.test(n) ? 60 : 15; }
function tmax() { return Math.max(budget(), frames.length ? mt(frames.length - 1) : 0) + 0.5; }
const tx = (t) => 8 + (t / tmax()) * (TLW - 16);
const tt = (x) => Math.max(0, Math.min(tmax(), ((x - 8) / (TLW - 16)) * tmax()));
function drawTimeline() {
  const r = tl.getBoundingClientRect();
  TLW = r.width;
  tl.width = Math.round(r.width * dpr()); tl.height = Math.round(48 * dpr());
  const g = tl.getContext("2d"); g.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  const base = 30, B = budget(), T = tmax();
  g.fillStyle = "rgba(255,255,255,0.045)"; g.fillRect(tx(0), 6, tx(B) - tx(0), base - 6);
  g.fillStyle = "#252a31"; g.fillRect(tx(0), base, tx(T) - tx(0), 1);
  g.fillStyle = "#6c7480"; g.font = "10px " + getComputedStyle(document.body).getPropertyValue("--mono");
  g.textAlign = "center"; g.textBaseline = "top";
  const step = T > 40 ? 10 : 5;
  for (let s = 0; s <= T; s += step) { g.fillRect(tx(s), base, 1, 4); g.fillText(String(s), tx(s), base + 6); }
  g.strokeStyle = "#e5534b"; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(tx(B) + 0.5, 4); g.lineTo(tx(B) + 0.5, base); g.stroke(); g.setLineDash([]);
  if (!frames.length) return;
  // progress: one tick per instruction change, cyan for mechanism calls
  let lastAt = -1;
  for (let k = 0; k < frames.length; k++) {
    const s = frames[k].state;
    if (s.action && s.action !== "none" && s.action_at_ms > lastAt) {
      lastAt = s.action_at_ms;
      const x = tx(s.action_at_ms / 1000);
      g.fillStyle = "rgba(31,200,240,0.6)";
      g.beginPath(); g.moveTo(x, base + 1); g.lineTo(x - 3, base + 6); g.lineTo(x + 3, base + 6); g.closePath(); g.fill();
    }
  }
  const endK = frames.findIndex((f) => f.state.done);
  g.fillStyle = "rgba(245,184,0,0.25)";
  g.fillRect(tx(0), base - 3, tx(mt(endK >= 0 ? endK : frames.length - 1)) - tx(0), 3);
  if (endK >= 0) {
    const x = tx(mt(endK)), late = mt(endK) > B;
    g.fillStyle = late ? "#e5534b" : "#a6aeb8";
    g.textAlign = "left"; g.textBaseline = "top"; g.fillText(`done ${mt(endK).toFixed(2)}s`, Math.min(x + 4, TLW - 70), 4);
    g.fillRect(x - 0.5, 6, 1, base - 6);
  }
  const x = tx(mt(cursor));
  g.fillStyle = "#f5b800"; g.fillRect(x - 1, 2, 2, base);
  g.beginPath(); g.arc(x, 4, 4, 0, Math.PI * 2); g.fill();
}
function seekTime(t) {
  if (!frames.length) return;
  let k = 0;
  while (k < frames.length - 1 && mt(k + 1) <= t) k++;
  cursor = k;
  follow = !replay && k === frames.length - 1;
  $("live").hidden = replay || follow;
  render();
}
let scrubbing = false;
tl.addEventListener("pointerdown", (e) => { scrubbing = true; tl.setPointerCapture(e.pointerId); pause(); seekTime(tt(e.offsetX)); });
tl.addEventListener("pointermove", (e) => { if (scrubbing) seekTime(tt(e.offsetX)); });
tl.addEventListener("pointerup", () => { scrubbing = false; });
$("live").onclick = () => { follow = true; cursor = frames.length - 1; $("live").hidden = true; render(); };

// ------------------------------------------------------------------ render
function render() {
  const i = frames.length ? Math.min(cursor, frames.length - 1) : -1;
  runGame();
  drawFieldLayer(i);
  renderScore(i >= 0 ? mt(i) : 0);
  if (i >= 0) { renderCode(i); $("clock").textContent = mt(i).toFixed(2); }
  // stats are the newest we have when following, else the nearest before the cursor
  let st = lastStats;
  if (i >= 0 && !follow) for (let k = i; k >= 0; k--) if (frames[k].stats) { st = frames[k].stats; break; }
  renderLoop(st, i >= 0 ? frames[i].state : idle && idle.state);
  drawTimeline();
}
function resize() { layout(); render(); }
window.addEventListener("resize", resize);

// ------------------------------------------------------------------ live / replay
function setConn(cls, text) { $("conn").className = "conn " + cls; $("connText").textContent = text; }
function connect() {
  const ws = new WebSocket(`ws://${location.hostname || "localhost"}:8081`);
  ws.onopen = () => setConn("live", "live");
  ws.onclose = () => { setConn("off", "offline"); setTimeout(connect, 1000); };
  ws.onmessage = (e) => ingest(JSON.parse(e.data));
}
// Replay a recording (launch arg record:=run.jsonl): index.html?replay=run.jsonl
const rp = new URLSearchParams(location.search).get("replay");
let playFrom = 0, playT0 = 0;
function play() {
  if (cursor >= frames.length - 1) cursor = 0;
  playing = true; playFrom = mt(cursor); playT0 = performance.now();
  $("playIcon").setAttribute("d", "M2 1h3v10H2zM7 1h3v10H7z");
  requestAnimationFrame(tick);
}
function pause() { playing = false; $("playIcon").setAttribute("d", "M2 1l9 5-9 5z"); }
function tick(now) {
  if (!playing) return;
  const t = playFrom + (now - playT0) / 1000;
  seekTime(t);
  if (cursor >= frames.length - 1) { pause(); return; }
  requestAnimationFrame(tick);
}
if (rp) {
  replay = true; follow = false;
  setConn("replay", "replay");
  $("play").hidden = false;
  $("play").onclick = () => (playing ? pause() : play());
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || !frames.length) return;
    if (e.key === " ") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === "ArrowRight") { pause(); seekTime(mt(cursor) + (e.shiftKey ? 1 : 0.1)); }
    else if (e.key === "ArrowLeft") { pause(); seekTime(mt(cursor) - (e.shiftKey ? 1 : 0.1)); }
  });
  fetch(rp).then((r) => r.text()).then((txt) => {
    loading = true;
    for (const line of txt.trim().split("\n")) ingest(JSON.parse(line));
    loading = false;
    cursor = 0;
    const at = parseFloat(new URLSearchParams(location.hash.slice(1)).get("t"));   // #t=24 opens paused there
    if (at >= 0) seekTime(at); else { render(); play(); }
  });
} else connect();
resize();

// Snapshot: lazy-load html2canvas only on click, so the page has no external deps otherwise.
window.saveSnapshot = async (name = "dashboard.png") => {
  if (!window.html2canvas) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  const c = await html2canvas(document.body, { backgroundColor: "#0f1114", scale: 2 });
  const r = await fetch("/snapshot", { method: "POST", headers: { "X-Snapshot-Name": name }, body: c.toDataURL("image/png") });
  return await r.text();
};
$("snap").onclick = () => saveSnapshot().then(() => { $("snap").textContent = "saved"; setTimeout(() => ($("snap").textContent = "png"), 1500); });
</script>
</body>
