<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>auton check</title>
<style>
  :root {
    --bg: #0f1114; --panel: #14171b; --raise: #1b1f25; --line: #252a31;
    --ink: #e7eaee; --ink2: #a6aeb8; --muted: #6c7480;
    --amber: #f5b800; --cyan: #1fc8f0; --red: #d8423b; --blue: #2f7fd8; --late: #e5534b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
  button, select { font: inherit; color: inherit; }
  #app { display: grid; grid-template-rows: 44px 1fr 72px; grid-template-columns: minmax(0, 1fr); height: 100vh; }

  header { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .name { font: 600 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font: 12px var(--mono); white-space: nowrap; }
  .grow { flex: 1; }
  .stats { font: 12px var(--mono); color: var(--ink2); white-space: nowrap; display: flex; gap: 14px; }
  .stats b { color: var(--ink); font-weight: 600; }
  .stats .bad b { color: var(--late); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 3px 9px; color: var(--ink2); cursor: pointer; font: 12px var(--mono); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--raise); color: var(--ink); }
  .seg button.red.on { color: #fff; background: var(--red); }
  .seg button.blue.on { color: #fff; background: var(--blue); }
  select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); color: var(--ink2); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
  #stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  #field { display: block; cursor: default; touch-action: none; }
  #hud { position: absolute; left: 12px; bottom: 10px; font: 12px var(--mono); color: var(--ink2); pointer-events: none; display: flex; gap: 14px; text-shadow: 0 1px 2px #000; }
  #hud b { color: var(--ink); font-weight: 500; }
  #note { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); display: flex; gap: 10px; align-items: center;
          font: 12px var(--mono); color: var(--amber); background: rgba(20,23,27,0.92); border: 1px solid #4a3d12; border-radius: 6px; padding: 5px 10px; flex-wrap: wrap; justify-content: center; row-gap: 4px; }
  #note > * { white-space: nowrap; }
  #note code { color: var(--ink); }
  #note button { background: none; border: 1px solid #4a3d12; border-radius: 4px; color: var(--amber); padding: 1px 7px; cursor: pointer; font: 11px var(--mono); }
  #hint { position: absolute; font: 11px var(--mono); color: var(--ink); background: rgba(20,23,27,0.9); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; pointer-events: none; white-space: nowrap; }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #code { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; font: 12px/1.25 var(--mono); }
  #code li { display: grid; grid-template-columns: 40px 12px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 3px 10px 3px 0; cursor: pointer; border-left: 2px solid transparent; }
  #code li:hover { background: var(--raise); }
  #code li.on { background: #222019; border-left-color: var(--amber); }
  #code li.sel { background: #10242b; border-left-color: var(--cyan); }
  #code .ln { color: var(--muted); text-align: right; }
  #code .tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
  #code .k-wait .tx, #code .k-delay .tx, #code .k-set .tx { color: var(--ink2); }
  #code .k-action .tx { color: #b9c3cc; }
  #code .done .tx { opacity: 0.55; }
  #code .g { width: 7px; height: 7px; border-radius: 1px; justify-self: center; }
  #code .k-motion .g { background: var(--amber); }
  #code .k-action .g { background: var(--cyan); transform: rotate(45deg); width: 6px; height: 6px; }
  #code .bd { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #code .bd.warn { color: var(--amber); }
  #code .bd.late { color: var(--late); }
  #why { border-top: 1px solid var(--line); padding: 8px 12px 10px; font: 11px/1.6 var(--mono); color: var(--ink2); }
  #why .row { display: grid; grid-template-columns: 58px 1fr; gap: 6px; }
  #why .k { color: var(--muted); }

  footer { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 0 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #play { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); cursor: pointer; display: grid; place-items: center; }
  #clock { font: 600 15px var(--mono); min-width: 64px; font-variant-numeric: tabular-nums; }
  #tl { width: 100%; height: 56px; display: block; cursor: pointer; touch-action: none; }
  #speed { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: 12px var(--mono); color: var(--ink2); }
  #tip { position: fixed; pointer-events: none; font: 11px var(--mono); background: #0b0d10; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; color: var(--ink); display: none; z-index: 5; white-space: nowrap; }

  @media (max-width: 860px) {
    #app { grid-template-rows: auto 1fr 72px; }
    header { flex-wrap: wrap; padding: 6px 12px; row-gap: 6px; white-space: normal; }
    .stats { flex-wrap: wrap; row-gap: 2px; }
    .stats > span { white-space: nowrap; }
    main { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) 220px; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="name" id="name"></span>
    <span class="sub" id="sub"></span>
    <span class="grow"></span>
    <select id="layout" title="field"></select>
    <span class="seg" id="side" title="alliance (mirrors the routine)"><button class="red" data-v="red">red</button><button class="blue" data-v="blue">blue</button></span>
    <span class="seg" id="units" title="units"><button data-v="in">in</button><button data-v="tiles">tiles</button></span>
    <span class="stats" id="stats"></span>
  </header>
  <main>
    <section id="stage"><canvas id="field"></canvas><div id="hud"></div><div id="note" hidden></div><div id="hint" hidden></div></section>
    <aside><ol id="code"></ol><div id="why"></div></aside>
  </main>
  <footer>
    <button id="play" title="play / pause (space)"><svg width="12" height="12" viewBox="0 0 12 12"><path id="playIcon" d="M2 1l9 5-9 5z" fill="currentColor"/></svg></button>
    <span id="clock">0.00</span>
    <canvas id="tl"></canvas>
    <button id="speed" title="playback speed">1×</button>
  </footer>
</div>
<div id="tip"></div>
<script>/*FIELD_JS*/</script>
<script>
"use strict";
const D = /*REPORT_DATA*/null;
const F = window.VexField;
const $ = (id) => document.getElementById(id);
const dpr = () => window.devicePixelRatio || 1;

// ------------------------------------------------------------------ state
const KEY = "sysvrc:" + D.name;
const store = { get(k, d) { try { const v = localStorage.getItem(KEY + ":" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(KEY + ":" + k, JSON.stringify(v)); } catch {} } };
// The side the routine's numbers are written for. A field start on the left
// half is red's side even in a .blue file: lots of teams write one side and
// mirror the turns with sgn, so x never flips.
const baseSide = D.field_start ? (D.field_start[0] < 0 ? "red" : "blue") : D.alliance || "red";
const S = {
  t: 0, playing: false, speed: 1,
  layout: store.get("layout", D.field),
  side: store.get("side", D.alliance || baseSide),
  units: store.get("units", "in"),
  sel: -1,                                            // selected action index
  place: null,                                        // field pose of the start, on the base side
  placed: false,                                      // has the user put it somewhere
};
const T = { end: D.stats.nominal, max: Math.max(D.stats.worst, D.budget, D.stats.total) + 0.6 };

// Where the routine starts on the field. A real field start (walls were
// simulated) is fixed. Otherwise: wherever the user dragged it last, or the
// routine's own odom_xyt_set if it looks like field coordinates, or a guess
// that keeps the whole path inside the walls.
(function initPlace() {
  if (D.field_start) { S.place = D.field_start.slice(); S.placed = true; return; }
  const saved = store.get("place", null);
  if (saved) { S.place = saved; S.placed = true; return; }
  const [x, y] = D.start;
  if ((x || y) && Math.abs(x) <= 66 && Math.abs(y) <= 66) { S.place = D.start.slice(); S.placed = true; return; }
  S.place = guessPlace();
})();

// Most routines zero odom at the start, so the code frame says nothing about
// where on the field they begin. Pick the start that keeps the path inside the
// walls, on the routine's own side, trusting the code's heading first.
function guessPlace() {
  const side = baseSide === "blue" ? 1 : -1, lim = F.HALF - 8, h0 = D.start[2];
  // after a drive_set push with no walls the path is meaningless; fit what's before it
  const push = D.instrs.find((r) => r.text.startsWith("drive_set(") && r.t >= 0);
  const cut = push ? Math.max(2, Math.floor(push.t / D.dt) + 1) : D.path.length;
  const pts = D.path.slice(0, cut).filter((_, i) => i % 2 === 0);
  const turns = [0, 90, -90, 180];
  for (let d = 15; d < 180; d += 15) if (d % 90) turns.push(d, -d);
  let best = null;
  for (const dh of turns) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of pts) {
      const q = F.codeToField(p, D.start, [0, 0, h0 + dh]);
      x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]);
    }
    // the start may sit anywhere in [lo, hi] on each axis and the path stays in
    const fit = (lo, hi, want) => (lo <= hi ? [Math.max(lo, Math.min(hi, want)), 0] : [(lo + hi) / 2, lo - hi]);
    const [sx, ox] = fit(-lim - x0, lim - x1, side * 64);
    const [sy, oy] = fit(-lim - y0, lim - y1, (-lim - y0 + lim - y1) / 2);
    const cost = (ox + oy) * 100 + (sx * side < 0 ? 500 : 0) + (dh === 0 ? 0 : dh % 90 === 0 ? 20 : 40) + Math.abs(sx - side * 64) * 0.1;
    if (!best || cost < best.cost) best = { cost, p: [Math.round(sx), Math.round(sy), h0 + dh] };
  }
  return best.p;
}

// code frame -> field, then mirror if showing the other alliance
const origin = D.field_start || D.start;
function toField(p) {
  let q = F.codeToField(p, origin, S.place);
  if (S.side !== baseSide) q = F.mirror(q);
  return q;
}
const sideColor = () => (S.side === "blue" ? F.BLUE : F.RED);

// ------------------------------------------------------------------ header
$("name").textContent = D.name;
$("sub").textContent = `${D.runs} runs`;
for (const [k, L] of Object.entries(F.LAYOUTS)) {
  const o = document.createElement("option"); o.value = k; o.textContent = L.name; $("layout").appendChild(o);
}
$("layout").value = S.layout;
$("layout").onchange = (e) => { S.layout = e.target.value; store.set("layout", S.layout); fieldCache = null; draw(); };
function segInit(id, key, after) {
  const el = $(id);
  const paint = () => el.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === S[key]));
  el.onclick = (e) => { const v = e.target.dataset && e.target.dataset.v; if (!v) return; S[key] = v; store.set(key, v); paint(); after && after(); draw(); };
  paint();
}
segInit("side", "side", () => { renderCode(); });
segInit("units", "units");

const st = D.stats;
const late = st.on_time < 100;
$("stats").innerHTML =
  `<span class="${late ? "bad" : ""}"><b>${st.on_time.toFixed(0)}%</b> on time</span>` +
  `<span>p95 <b>${st.p95.toFixed(2)}s</b></span>` +
  `<span title="end point spread, p95">±<b>${len(st.end_p95, 1)}</b></span>`;

function len(v, d) { return F.fmtLen(v, S.units, S.units === "tiles" ? (d == null ? 2 : d + 1) : d); }

// ------------------------------------------------------------------ code rail
const code = $("code");
function exitWord(e) {
  return { small_error: "settled", big_error: "settled", passed: "passed", velocity: "stalled", timeout: "timeout", running: "" }[e] || e || "";
}
function renderCode() {
  code.innerHTML = "";
  D.instrs.forEach((r, i) => {
    const li = document.createElement("li");
    li.className = "k-" + r.kind;
    li.dataset.i = i;
    let bd = "", cls = "bd";
    if (i === st.late_i && late) { bd = `${(100 - st.on_time).toFixed(0)}% at buzzer`; cls += " late"; }
    else if (r.kind === "wait") {
      if (r.stall >= 1) { bd = `${r.stall.toFixed(0)}% stall`; cls += " warn"; }
      else bd = exitWord(r.exit);
    } else if (r.kind === "action" && r.action != null) {
      bd = "±" + len(D.actions[r.action].p95, 1);
    }
    li.innerHTML = `<span class="ln">${r.line || ""}</span><span class="g"></span><span class="tx"></span><span class="${cls}">${bd}</span>`;
    li.querySelector(".tx").textContent = r.text.replace(/^action\("(.*)"\)$/, "$1");
    li.title = r.text;
    li.onclick = () => {
      if (r.kind === "action") selectAction(r.action, true);
      else { S.sel = -1; seek(Math.max(0, r.t)); }
    };
    code.appendChild(li);
  });
  syncCode(true);
}
let lastOn = -1;
function syncCode(force) {
  let on = 0;
  for (let i = 0; i < D.instrs.length; i++) if (D.instrs[i].t >= 0 && D.instrs[i].t <= S.t + 1e-6) on = i;
  const items = code.children;
  if (on === lastOn && !force) return;
  for (let i = 0; i < items.length; i++) {
    items[i].classList.toggle("on", i === on);
    items[i].classList.toggle("done", i < on);
    const a = D.instrs[i].action;
    items[i].classList.toggle("sel", a != null && a === S.sel);
  }
  if (items[on] && (on !== lastOn || force)) items[on].scrollIntoView({ block: "nearest" });
  lastOn = on;
}

// why: the two rankings, compact
(function renderWhy() {
  const w = D.why || { spread: [], late: [] };
  const top = (xs, f) => xs.slice(0, 3).map(f).join(" · ");
  const short = (n) => n.replace("placement (heading)", "heading").replace("placement (x/y)", "placement").replace("motor response", "motors").replace("L/R mismatch", "L/R").replace("wheel slip", "slip").replace("gyro drift", "gyro");
  const rows = [];
  if (w.spread.length) rows.push(["spread", top(w.spread, ([n, v]) => `${short(n)} ${len(v, 1)}`)]);
  const lateRows = w.late.filter(([, dt]) => dt > 0.05);
  if (lateRows.length) rows.push(["late", top(lateRows, ([n, dt]) => `${short(n)} +${dt.toFixed(2)}s`)]);
  $("why").innerHTML = rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span>${v}</span></div>`).join("");
  if (!rows.length) $("why").remove();
})();

// ------------------------------------------------------------------ note (warnings + field-start helper)
function renderNote() {
  const n = $("note");
  if (!D.warnings.length || D.field_start) { n.hidden = true; return; }
  const p = S.place.map((v, i) => String(+(i < 2 ? v : F.wrapDeg(v)).toFixed(i < 2 ? 1 : 0)));
  const cmd = `--field-start ${p.join(",")}`;
  n.hidden = false;
  n.innerHTML = `<span>wall push needs a start · drag the robot, rerun with</span><code></code><button>copy</button>`;
  n.querySelector("code").textContent = cmd;
  n.querySelector("button").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(cmd); n.querySelector("button").textContent = "copied"; };
}

// ------------------------------------------------------------------ geometry helpers
function sampleAt(arr, dt, t) {
  if (!arr.length) return null;
  const f = t / dt, i = Math.floor(f);
  if (i >= arr.length - 1) return arr[arr.length - 1];
  if (i < 0) return arr[0];
  const a = arr[i], b = arr[i + 1], u = f - i;
  let dh = b[2] - a[2]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + dh * u];
}

// ------------------------------------------------------------------ field canvas
const fc = $("field");
let V = null, fieldCache = null, size = 0;
function layout() {
  const r = $("stage").getBoundingClientRect();
  size = Math.max(200, Math.floor(Math.min(r.width, r.height) - 16));
  fc.style.width = fc.style.height = size + "px";
  fc.width = fc.height = Math.round(size * dpr());
  V = F.view(size, 82);
  fieldCache = null;
}
function drawStatic() {
  const c = document.createElement("canvas");
  c.width = c.height = Math.round(size * dpr());
  const g = c.getContext("2d");
  g.scale(dpr(), dpr());
  F.drawField(g, V, S.layout);
  fieldCache = c;
}

function draw() {
  if (!V) return;
  if (!fieldCache) drawStatic();
  const g = fc.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(fieldCache, 0, 0);
  g.scale(dpr(), dpr());
  const P = (p) => V.px(p[0], p[1]);
  const path = D.path.map(toField);

  // the clean run's path: faint ahead of the robot, solid behind it
  const k = Math.min(path.length - 1, Math.floor(S.t / D.dt));
  g.lineJoin = g.lineCap = "round";
  g.strokeStyle = "rgba(245,184,0,0.32)"; g.lineWidth = 2;
  poly(g, path, 0, path.length - 1, P);
  g.strokeStyle = "#f5b800"; g.lineWidth = 2.5;
  poly(g, path, 0, k, P);

  // mechanism calls along the path
  D.actions.forEach((a, i) => {
    const q = toField([a.at[0], a.at[1], 0]);
    const [x, y] = P(q);
    g.save(); g.translate(x, y); g.rotate(Math.PI / 4);
    g.fillStyle = i === S.sel ? "#1fc8f0" : "rgba(31,200,240,0.75)";
    g.strokeStyle = "#14171b"; g.lineWidth = 2;
    const r = i === S.sel ? 5 : 3.5;
    g.beginPath(); g.rect(-r, -r, 2 * r, 2 * r); g.stroke(); g.fill();
    g.restore();
  });

  // the selected call: where it fired in every run, and the p95 circle
  let callout = null;
  if (S.sel >= 0) {
    const a = D.actions[S.sel];
    g.fillStyle = "rgba(31,200,240,0.55)";
    for (const pt of a.pts) { const [x, y] = P(toField([pt[0], pt[1], 0])); g.beginPath(); g.arc(x, y, 2, 0, Math.PI * 2); g.fill(); }
    const [cx, cy] = P(toField([a.at[0], a.at[1], 0]));
    g.setLineDash([4, 3]); g.strokeStyle = "#1fc8f0"; g.lineWidth = 1.5;
    g.beginPath(); g.arc(cx, cy, Math.max(3, a.p95 * V.s), 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    callout = [D.instrs[a.i].text.replace(/^action\("(.*)"\)$/, "$1") + "  ±" + len(a.p95, 1), cx, cy - Math.max(3, a.p95 * V.s) - 10];
  }

  // every varied run at this moment
  const [w, l] = D.robot;
  for (const run of D.ghosts) {
    const p = sampleAt(run, D.gdt, S.t);
    if (p) F.drawRobot(g, V, toField(p), { w, l, stroke: "rgba(255,255,255,0.22)", width: 1 });
  }

  // where it started, once it has left
  if (S.t > 0.05) F.drawRobot(g, V, toField(D.path[0]), { w, l, stroke: "rgba(255,255,255,0.35)", width: 1 });

  // the clean run
  const me = sampleAt(D.path, D.dt, S.t);
  F.drawRobot(g, V, toField(me), { w, l, fill: sideColor(), stroke: "#fff", front: "#fff", width: 1.5, alpha: 0.95 });
  if (callout) label(g, ...callout);
  hud(me);
}
function poly(g, pts, a, b, P) {
  if (b <= a) return;
  g.beginPath();
  for (let i = a; i <= b; i++) { const [x, y] = P(pts[i]); i === a ? g.moveTo(x, y) : g.lineTo(x, y); }
  g.stroke();
}
function label(g, text, x, y) {
  g.font = "600 11px " + getComputedStyle(document.body).getPropertyValue("--mono");
  g.textBaseline = "middle";
  const wpx = g.measureText(text).width;
  x = Math.max(4, Math.min(size - 4 - wpx, x - wpx / 2));
  y = Math.max(10, y);
  g.lineWidth = 4; g.strokeStyle = "#14171b"; g.strokeText(text, x, y);
  g.fillStyle = "#e7eaee"; g.fillText(text, x, y);
}

let hover = null;
function hud(me) {
  const q = toField(me);
  const parts = [`<span>x <b>${len(q[0])}</b></span>`, `<span>y <b>${len(q[1])}</b></span>`, `<span>θ <b>${F.wrapDeg(q[2]).toFixed(0)}°</b></span>`];
  if (hover) parts.push(`<span style="color:var(--muted)">cursor ${len(hover[0])}, ${len(hover[1])}</span>`);
  $("hud").innerHTML = parts.join("");
}

// ------------------------------------------------------------------ dragging the start
let drag = null;
const hint = $("hint");
function overStart(px, py) {
  const s = toField(D.path[0]);
  const [x, y] = V.px(s[0], s[1]);
  return Math.hypot(px - x, py - y) < (D.robot[0] / 2 + 3) * V.s;
}
function showHint() {
  if (S.placed || D.field_start || S.t > 0.05) { hint.hidden = true; return; }
  const s = toField(D.path[0]);
  const [x, y] = V.px(s[0], s[1]);
  const r = $("field").getBoundingClientRect(), st2 = $("stage").getBoundingClientRect();
  hint.hidden = false;
  hint.textContent = "drag to your start · [ ] to rotate";
  const left = r.left - st2.left + x - hint.offsetWidth / 2;
  hint.style.left = Math.max(6, Math.min(st2.width - hint.offsetWidth - 6, left)) + "px";
  hint.style.top = (r.top - st2.top + y + (D.robot[1] / 2 + 6) * V.s) + "px";
}
fc.addEventListener("pointermove", (e) => {
  const r = fc.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  hover = V.inches(px, py);
  if (drag) {
    let [x, y] = V.inches(px - drag.dx, py - drag.dy);
    if (S.side !== baseSide) x = -x;                 // stored on the base side
    const lim = F.HALF - D.robot[0] / 2;
    S.place = [Math.max(-lim, Math.min(lim, Math.round(x * 2) / 2)), Math.max(-lim, Math.min(lim, Math.round(y * 2) / 2)), S.place[2]];
    S.placed = true; store.set("place", S.place); renderNote(); showHint();
  }
  fc.style.cursor = drag ? "grabbing" : !D.field_start && overStart(px, py) ? "grab" : "default";
  draw();
});
fc.addEventListener("pointerleave", () => { hover = null; draw(); });
fc.addEventListener("pointerdown", (e) => {
  const r = fc.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (D.field_start || !overStart(px, py)) return;
  const s = toField(D.path[0]);
  const [x, y] = V.px(s[0], s[1]);
  drag = { dx: px - x, dy: py - y };
  fc.setPointerCapture(e.pointerId);
});
fc.addEventListener("pointerup", () => { drag = null; });
fc.addEventListener("dblclick", (e) => {
  const r = fc.getBoundingClientRect();
  if (D.field_start || !overStart(e.clientX - r.left, e.clientY - r.top)) return;
  try { localStorage.removeItem(KEY + ":place"); } catch {}
  location.reload();
});
function rotateStart(d) {
  if (D.field_start) return;
  S.place = [S.place[0], S.place[1], S.place[2] + (S.side !== baseSide ? -d : d)];
  S.placed = true; store.set("place", S.place); renderNote(); showHint(); draw();
}

// ------------------------------------------------------------------ timeline
const tl = $("tl");
let TLW = 0;
function tlLayout() {
  const r = tl.getBoundingClientRect();
  TLW = r.width;
  tl.width = Math.round(r.width * dpr()); tl.height = Math.round(56 * dpr());
}
const tx = (t) => 8 + (t / T.max) * (TLW - 16);
const tt = (x) => Math.max(0, Math.min(T.max, ((x - 8) / (TLW - 16)) * T.max));
const BIN = 0.1;
const bins = (() => {
  const b = new Map();
  for (const f of D.finish) { const k = Math.floor(f / BIN); b.set(k, (b.get(k) || 0) + 1); }
  return b;
})();
const binMax = Math.max(1, ...bins.values());
function drawTimeline() {
  const g = tl.getContext("2d");
  g.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  g.clearRect(0, 0, TLW, 56);
  const base = 40;
  // auton period
  g.fillStyle = "rgba(255,255,255,0.045)";
  g.fillRect(tx(0), 6, tx(D.budget) - tx(0), base - 6);
  // ticks
  g.fillStyle = "#6c7480"; g.font = "10px " + getComputedStyle(document.body).getPropertyValue("--mono");
  g.textAlign = "center"; g.textBaseline = "top";
  const step = T.max > 40 ? 10 : T.max > 20 ? 5 : 1;
  for (let s = 0; s <= T.max; s += step) {
    g.fillRect(tx(s), base, 1, 4);
    if (s % (step === 1 ? 5 : step) === 0) g.fillText(String(s), tx(s), base + 6);
  }
  g.fillStyle = "#252a31"; g.fillRect(tx(0), base, tx(T.max) - tx(0), 1);
  // when runs finished
  for (const [k, n] of bins) {
    const t0 = k * BIN, h = 4 + (n / binMax) * 22;
    g.fillStyle = t0 >= D.budget ? "rgba(229,83,75,0.85)" : "rgba(166,174,184,0.55)";
    const x = tx(t0), w = Math.max(1, tx(t0 + BIN) - x - 1);
    g.fillRect(x, base - h, w, h);
  }
  // buzzer
  g.strokeStyle = "#e5534b"; g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(tx(D.budget) + 0.5, 4); g.lineTo(tx(D.budget) + 0.5, base); g.stroke(); g.setLineDash([]);
  // mechanism calls
  D.actions.forEach((a, i) => {
    g.fillStyle = i === S.sel ? "#1fc8f0" : "rgba(31,200,240,0.5)";
    const x = tx(a.t);
    g.beginPath(); g.moveTo(x, base + 1); g.lineTo(x - 3, base + 6); g.lineTo(x + 3, base + 6); g.closePath(); g.fill();
  });
  // playhead
  const x = tx(S.t);
  g.fillStyle = "#f5b800"; g.fillRect(x - 1, 2, 2, base);
  g.beginPath(); g.arc(x, 4, 4, 0, Math.PI * 2); g.fill();
}
let scrubbing = false;
tl.addEventListener("pointerdown", (e) => { scrubbing = true; tl.setPointerCapture(e.pointerId); pause(); seek(tt(e.offsetX)); });
tl.addEventListener("pointermove", (e) => {
  if (scrubbing) seek(tt(e.offsetX));
  const t = tt(e.offsetX), n = bins.get(Math.floor(t / BIN)) || 0;
  const tip = $("tip");
  tip.style.display = "block";
  tip.textContent = `${t.toFixed(2)}s` + (n ? ` · ${n} run${n > 1 ? "s" : ""} finish` : "") + (t > D.budget ? " · after buzzer" : "");
  tip.style.left = e.clientX + 10 + "px"; tip.style.top = e.clientY - 28 + "px";
});
tl.addEventListener("pointerup", () => { scrubbing = false; });
tl.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });

// ------------------------------------------------------------------ playback
function seek(t) {
  S.t = Math.max(0, Math.min(T.max, t));
  $("clock").textContent = S.t.toFixed(2);
  syncCode(); draw(); drawTimeline(); showHint();
  if (!S.playing) linkHere();
}
// #t=9.3&a=12 opens the report at that moment with that call selected
function linkHere() {
  try { history.replaceState(null, "", "#t=" + S.t.toFixed(2) + (S.sel >= 0 ? "&a=" + S.sel : "")); } catch {}
}
let last = 0;
function frame(now) {
  if (!S.playing) return;
  const dt = (now - last) / 1000; last = now;
  if (S.t >= T.max) { pause(); return; }
  seek(S.t + dt * S.speed);
  requestAnimationFrame(frame);
}
function play() { if (S.t >= T.max - 0.01) S.t = 0; S.playing = true; last = performance.now(); $("playIcon").setAttribute("d", "M2 1h3v10H2zM7 1h3v10H7z"); requestAnimationFrame(frame); }
function pause() { S.playing = false; $("playIcon").setAttribute("d", "M2 1l9 5-9 5z"); }
$("play").onclick = () => (S.playing ? pause() : play());
const speeds = [0.5, 1, 2, 4];
$("speed").onclick = () => { S.speed = speeds[(speeds.indexOf(S.speed) + 1) % speeds.length]; $("speed").textContent = S.speed + "×"; };

function selectAction(i, jump) {
  S.sel = S.sel === i ? -1 : i;
  if (S.sel >= 0 && jump) seek(D.actions[i].t); else { syncCode(true); draw(); drawTimeline(); linkHere(); }
}

window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); S.playing ? pause() : play(); }
  else if (e.key === "ArrowRight") { pause(); seek(S.t + (e.shiftKey ? 1 : 0.1)); }
  else if (e.key === "ArrowLeft") { pause(); seek(S.t - (e.shiftKey ? 1 : 0.1)); }
  else if (e.key === "Home") seek(0);
  else if (e.key === "End") seek(T.end);
  else if (e.key === "[") rotateStart(e.shiftKey ? -1 : -5);
  else if (e.key === "]") rotateStart(e.shiftKey ? 1 : 5);
  else if (e.key === "." || e.key === ",") {
    if (!D.actions.length) return;
    const dir = e.key === "." ? 1 : -1;
    const cur = S.sel >= 0 ? S.sel : dir > 0 ? -1 : D.actions.length;
    const n = Math.max(0, Math.min(D.actions.length - 1, cur + dir));
    S.sel = -1; selectAction(n, true);
  }
});

// ------------------------------------------------------------------ go
function resize() { layout(); tlLayout(); draw(); drawTimeline(); showHint(); }
window.addEventListener("resize", resize);
renderCode();
renderNote();
resize();
(function fromLink() {
  const h = new URLSearchParams(location.hash.slice(1));
  const a = parseInt(h.get("a"), 10);
  if (a >= 0 && a < D.actions.length) S.sel = a;
  seek(parseFloat(h.get("t")) || 0);
})();
</script>
