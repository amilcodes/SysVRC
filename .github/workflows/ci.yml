name: ci
on:
  push: { branches: [main] }
  pull_request:

# bash -eo pipefail for every step: without pipefail, `cmd | tee log` reports
# tee's exit code and a failing test step shows up green.
defaults:
  run:
    shell: bash

jobs:
  core:
    name: core + auton_check (host, no ROS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release && cmake --build build/core -j
      - run: ctest --test-dir build/core --output-on-failure
      - name: every imported routine, one line each
        run: for f in autons/*.auton; do build/core/auton_check "$f" --runs 100 --brief; done

  importer:
    name: tools (autons/ and generated web files up to date)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -W error::ResourceWarning -m unittest discover -s tools/tests -v

  sim:
    name: sim (ROS 2 Jazzy + Gazebo Harmonic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sim/docker/Dockerfile
          tags: sysvrc-sim:jazzy
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: colcon build + test
        run: |
          docker run --rm -v "$PWD":/ws/src/sysvrc -w /ws sysvrc-sim:jazzy bash -lc '
            colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release --event-handlers console_cohesion+ &&
            colcon test --event-handlers console_cohesion+ &&
            colcon test-result --verbose'
      - name: end-to-end (plant backend, RT loop, routines complete)
        run: |
          docker run --rm --cap-add=SYS_NICE --cap-add=IPC_LOCK --ulimit rtprio=99 --ulimit memlock=-1 \
            -v "$PWD":/ws/src/sysvrc -w /ws sysvrc-sim:jazzy bash -lc '
            colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release > /dev/null &&
            src/sysvrc/sim/tools/smoke_test.sh 22 skills fifo 1 true 500 &&
            src/sysvrc/sim/tools/smoke_test.sh 24 state_solo_awp.blue fifo 1 true 500' 2>&1 | tee smoke.log
      - name: gazebo headless spawns + bridges
        run: |
          docker run --rm --cap-add=SYS_NICE --ulimit rtprio=99 --ulimit memlock=-1 \
            -v "$PWD":/ws/src/sysvrc -w /ws sysvrc-sim:jazzy bash -lc '
            colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release > /dev/null &&
            src/sysvrc/sim/tools/gazebo_smoke.sh 25 square 6.0'
